title : Governed Autonomy Honesty
description : Certified abstention under uncertainty — can governed systems withhold confident answers? 16 adversarial cases (decidable, ignorance, conflict); deterministic scoring, no LLM judge.
image : logo.png
terms : pages/terms.md
pages :
- title : overview
  file : pages/overview.md
- title : evaluation
  file : pages/evaluation.md
leaderboards :
- title : Results
  key : main
  columns :
  - title : Precision@certified
    key : precision_at_certified
    index : 0
    sorting : desc
  - title : False-cert rate
    key : false_certification_rate
    index : 1
    sorting : asc
  - title : Abstention recall
    key : abstention_recall
    index : 2
    sorting : desc
  - title : Determined accuracy
    key : determined_accuracy
    index : 3
    sorting : desc
phases :
- index : 0
  name : Honesty evaluation
  description : Submit answers.json with [{case_id, truth, certified}] for the 16 cases.
  tasks :
  - index : 0
    name : honesty-16
    description : Certified abstention on adversarial trivalent cases.
    input_data : honesty_task/input_data/cases.json
    reference_data : honesty_task/reference_data/labels.json
    scoring_program : honesty_task/scoring_program
    max_submissions : 20
    max_submissions_per_day : 5
