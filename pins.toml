# pins.toml — durable package sources that vOSLAB pins.
#
# Per the ratified vOSLAB plan, the durable, GitHub-facing package homes live
# OUTSIDE the ephemeral ~/vOSlab, at ~/packages/{public,framework}/. This file
# declares those sources + pinned tags. bootstrap.sh --with-packages reads it
# (via scripts/resolve_pins.py, built in the extraction phase) to clone each at
# its pinned tag into ~/packages/<layer>/<pkg> and link into vOSLAB/packages/*.
#
# Repo URLs below are PLACEHOLDERS until the ~/packages/* repos are created.

[socratic-engine]
repo = "git@github.com:vOS/socratic-engine.git"
tag = "v1.0.0"
layer = "public"
pin = "packages/public/socratic-engine"

[state-canon-mcp]
repo = "git@github.com:vOS/state-canon-mcp.git"
tag = "v0.1.0"
layer = "public"
pin = "packages/public/state-canon-mcp"

# framework pins (built later in the admission order)
[vos-kernel]
repo = "git@github.com:vOS/vos-kernel.git"
tag = "v0.1.0"
layer = "framework"
pin = "packages/framework/vos-kernel"

[gate-suite]
repo = "git@github.com:vOS/gate-suite.git"
tag = "v0.1.0"
layer = "framework"
pin = "packages/framework/gate_suite"

[state-canon-infra]
repo = "git@github.com:vOS/state-canon-infra.git"
tag = "v0.1.0"
layer = "framework"
pin = "packages/framework/state-canon-infra"

[state-canon-agent]
repo = "git@github.com:vOS/state-canon-agent.git"
tag = "v0.1.0"
layer = "framework"
pin = "packages/framework/state-canon-agent"
