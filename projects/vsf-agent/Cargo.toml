[package]
name = "vsf-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
async-nats = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["float_roundtrip"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.21"
thiserror = "1"
tokio = { version = "1", features = ["fs", "rt"] }
rand = "0.8"
tempfile = "3"  # for tests
