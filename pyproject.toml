[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vOSlab"
version = "0.0.0"
description = "vOSLAB experimental workspace — P0.1 clean gate-suite first"
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
# Workspace: nothing packaged yet. gate-suite is the first real package.
packages = ["packages/framework/gate_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/framework"]
