[package]
name = "vsl-core"
version = "0.1.0"
edition = "2021"
description = "VSL Core — formal language for viable systems, implemented in Rust"
authors = ["rmw3 <rmw3kufe@proton.me>"]
license = "Apache-2.0"

[lib]
name = "vsl_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
proptest = "1"

[features]
default = []
python = ["pyo3"]
