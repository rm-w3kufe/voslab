[package]
name = "vsl-core"
version = "0.1.0"
edition = "2021"
description = "VSL Core — formal language for viable systems, implemented in Rust"
authors = ["rmw3 <rmw3kufe@proton.me>"]
license = "Apache-2.0"

# VSL Core implements the formal specification from:
# - docs/spec_revision/system/boot/core_boot_primer.vsm (A0-A11)
# - docs/spec_revision/system/s5-policy/vsl-language/axioms_extension.vsm (A12-A15)
# - docs/spec_revision/system/boot/regulation_layer.vsm (boundary axioms)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
proptest = "1"
