[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vos-kernel"
version = "0.1.0"
description = "Kernel del sistema VSF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "VSF Team" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vos_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# This ini makes rootdir=vos_kernel, which CUTS OFF the repo-root conftest
# (and its packages/framework injection) for runs from anywhere. Without
# this, `import vos_kernel` falls through to the stale pip-editable copy at
# ~/packages/framework/vos_kernel (no epistemic/router) -> collection error.
# ".." relative to this file's directory = packages/framework, the repo's
# package root (paths resolve against the INI dir, so "../.." would overshoot
# to packages/ and miss vos_kernel entirely).
pythonpath = [".."]
